# This project's own gate settings, read after tools/gate.conf; a line here
# overrides the template's (for example TURN_BUDGET=90). Template updates never
# change this file. It is protected like the rest of tools/.
# PROSE_EXCLUDE: markdown the prose step skips, as globs (dir/** for a
# subtree), for quoted or archived material that is not in GG's voice.
# PROSE_EXCLUDE="research/*/**"
# ACCEPTANCE_BATCH: a program whose task run lines the full gate runs once,
# with all their words, instead of once per task; when that run fails, each
# task's line runs alone. For a suite that checks the requirements named and
# then runs every test, as tests/acceptance/reqs.sh REQ-AREA-NN... does.
# ACCEPTANCE_BATCH=tests/acceptance/reqs.sh
# ACCEPTANCE_TIMEOUT: seconds one acceptance run may take, 1800 by default;
# past it the run fails, and so does its task.
# ACCEPTANCE_TIMEOUT=1800
# TEST_EDITS: whose edits to an existing test need a 'Modifies test:' line.
# all, the default, means every commit; agents means commits on agent/*
# branches and on a branch the checks cannot name (a detached HEAD), so the
# coordinator edits tests freely and agents still declare theirs. Agent work
# is judged as an agent's when it lands as agent/NAME; commits moved onto
# another branch are judged as that branch's. A removed test always needs its
# 'Removes test:' line.
# TEST_EDITS=agents
# STOP_HOOK: when the Claude Code Stop hook runs the turn gate. always, the
# default, ends every turn with it; agents runs it only on agent/* branches,
# so a session GG drives is not held at each turn's end. The commit hook runs
# the turn gate either way.
# STOP_HOOK=agents
# GATE_TOOLS: commands this project's own gate steps run (tools/gate.d)
# beyond its stacks' tools, which tools/agent-loop puts on a worker's
# sandbox PATH too, so the gate passes there as it does here.
# GATE_TOOLS="bun"
