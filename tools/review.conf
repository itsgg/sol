# Reviewers for tools/review, in order of preference, as family:reviewer. A
# change is reviewed by the first whose family is not its author's. This file
# is the one place a reviewer or a model is named.
REVIEWERS="google:agy openai:codex anthropic:claude"
AGY_MODEL=${AGY_MODEL:-gemini-3.8-flash-low}
AGY_EFFORT=${AGY_EFFORT:-low}
# Seconds one review attempt may take; three failed attempts move to the next family.
# Unset, it grows with the change, since a reviewer reads the tree a file at a
# time: 120 plus 15 for each changed file, from 180 to 900.
REVIEW_TIMEOUT=${REVIEW_TIMEOUT:-}
# Hard-stop a reviewer that ignores TERM; show progress while it runs.
REVIEW_KILL_AFTER=${REVIEW_KILL_AFTER:-5}
REVIEW_PROGRESS_INTERVAL=${REVIEW_PROGRESS_INTERVAL:-15}
